plugins {
    id 'com.android.application'
}

android {
    namespace 'com.victor.treinohibrido'
    compileSdk 35

    defaultConfig {
        applicationId 'com.victor.treinohibrido'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '1.2.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
